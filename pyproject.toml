[project]
name = "evalrep"
version = "0.1.0"
description = "Replications of published LLM evaluations, implemented in Inspect."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # inspect-ai treats model SDKs as optional extras; declare the ones we use so they
    # survive `uv sync` (an undeclared SDK gets pruned, and the eval then fails with
    # "requires optional dependencies" rather than anything informative).
    "inspect-ai>=0.3.258",
    "openai>=3.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalrep"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
